[project]
name = "soundprint"
version = "0.1.0"
description = "Measures how a local music collection sounds (tempo, key, loudness, timbre, rhythm), matches each file to a MusicBrainz recording, and feeds the features to Hurdy Gurdy's catalogue."
readme = "README.md"
license = "MIT"
authors = [{ name = "Idin", email = "idin@ixmachina.ai" }]
requires-python = ">=3.12"
dependencies = []

[project.urls]
Repository = "https://github.com/idin/soundprint"
Issues = "https://github.com/idin/soundprint/issues"

[dependency-groups]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soundprint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
